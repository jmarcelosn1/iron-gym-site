<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Iron Gym</title>
    <!-- Atalho de dois cliques: abre o site pronto (dist/index.html). No servidor de desenvolvimento
         (npm run dev) a página fica em /app.html, o código-fonte. -->
    <script>
      location.replace(location.protocol === "file:" ? "dist/index.html" : "app.html");
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070808; color: #c5cacf; font: 16px/1.5 system-ui, sans-serif; }
      a { color: #f2f3f3; }
    </style>
  </head>
  <body>
    <p><a href="dist/index.html">Abrir o site da Iron Gym</a></p>
  </body>
</html>
